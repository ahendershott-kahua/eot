name: deploy-pages
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      
      # Upload the entire repository as the site
      # Since you don't use a build step or 'dist' folder, path is set to '.'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - uses: actions/deploy-pages@v4
